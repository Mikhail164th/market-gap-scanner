[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-gap-scanner"
version = "0.1.0"
description = "Keyword research and market niche analysis tool using Yandex Wordstat API and Reddit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25",
    "praw>=7.0",
    "openai>=1.0",
]

[project.scripts]
market-gap-scanner = "market_gap_scanner.cli:main"
